name: Vestige
options:
  bundleIdPrefix: dev.blackphi6
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "0.4.1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
targets:
  Vestige:
    type: application
    platform: macOS
    sources:
      - path: Sources/Vestige
      - path: Resources/Assets.xcassets
    info:
      path: Sources/Vestige/Info.plist
      properties:
        CFBundleDisplayName: Vestige
        CFBundleShortVersionString: "0.4.1"
        CFBundleVersion: "0.4.1"
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026. MIT Licensed."
        NSHighResolutionCapable: true
        LSUIElement: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [ja, en, zh-Hans]
        CFBundleDevelopmentRegion: ja
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blackphi6.vestige
        PRODUCT_NAME: Vestige
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - VestigeTests
      gatherCoverageData: true
  VestigeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/VestigeTests
    dependencies:
      - target: Vestige
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
