name: Vestige
options:
  bundleIdPrefix: dev.blackphi6
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.0"
    # Sparkle compares this (sparkle:version in the appcast) to detect newer releases,
    # so it must change on every release, not stay pinned like a build counter. Keep it
    # equal to MARKETING_VERSION for simplicity.
    CURRENT_PROJECT_VERSION: "0.3.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6
targets:
  Vestige:
    type: application
    platform: macOS
    sources:
      - path: Sources/Vestige
      - path: Resources/Assets.xcassets
    dependencies:
      - package: Sparkle
    info:
      path: Sources/Vestige/Info.plist
      properties:
        CFBundleDisplayName: Vestige
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "0.3.0"
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026. MIT Licensed."
        NSHighResolutionCapable: true
        LSUIElement: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [ja, en, zh-Hans]
        CFBundleDevelopmentRegion: ja
        SUFeedURL: https://github.com/Blackphi6/vestige/releases/latest/download/appcast.xml
        SUPublicEDKey: a5Ie6ch3YMwhYT0B3oXzl+r4VwNBt//m7ZZ42xhzIP8=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blackphi6.vestige
        PRODUCT_NAME: Vestige
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - VestigeTests
      gatherCoverageData: true
  VestigeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/VestigeTests
    dependencies:
      - target: Vestige
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
